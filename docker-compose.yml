services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_dev}
      MYSQL_DATABASE: ${DB_NAME:-contatos}
      MYSQL_USER: ${DB_USER:-contatos}
      MYSQL_PASSWORD: ${DB_PASSWORD:-contatos_dev}
    ports:
      - '127.0.0.1:${DB_PORT:-3306}:3306'
    volumes:
      - dados-mysql:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u root -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  dados-mysql:
